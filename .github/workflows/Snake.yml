name: Generate profile visuals

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate light trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=${{ github.repository_owner }}&theme=flat&column=4&row=2&margin-w=8&margin-h=8&no-bg=true&no-frame=true"
          path: dist/github-trophies-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate dark trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=${{ github.repository_owner }}&theme=tokyonight&column=4&row=2&margin-w=8&margin-h=8&no-bg=true&no-frame=true"
          path: dist/github-trophies-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
